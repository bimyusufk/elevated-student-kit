<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ElevatEd Student Kit</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='rgb(20,51,88)'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#143358">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ElevatEd">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="google-site-verification" content="Kn4SzVN7sCpU99KLWL2HkY1VlRjzfBYgS7GvGUtOk3M" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --navy: #143358;
            --navy-lt: #2A5088;
            --navy-deep: #0B1D33;
            --crimson: #E62129;
            --crimson-dim: #C81B24;
            --gold: #E9A23B;
            --gold-dim: #C97E1E;
            --pop: #FFC845;
            --pop-soft: #FFF3D2;
            --paper: #FAF7F1;
            --surface: #FFFFFF;
            --surface-2: #E7ECF6;
            --border: #143358;
            --text: #17263A;
            --muted: #6B7280;
            --faint: #9CA6B4;
            --ok: #1FA35A;
            --radius: 18px;
            --radius-sm: 13px;
            --radius-pill: 999px;
            --shadow-card: 0 1px 2px rgba(21, 16, 31, .05), 0 8px 20px -14px rgba(21, 16, 31, .18);
            --shadow-navy: 4px 4px 0 var(--navy);
            --shadow-gold: 4px 4px 0 var(--gold);
            --shadow-crimson: 4px 4px 0 var(--crimson);
            --shadow-pop: 4px 4px 0 var(--pop);
            --font-display: 'Fraunces', serif;
            --font-accent: 'Fraunces', serif;
            --font-body: 'Montserrat', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --nav-h: 68px;
            --sidebar-w: 216px;
            --sidebar-w-collapsed: 76px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
        }

        .mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        h1,
        h2,
        h3 {
            font-family: var(--font-display);
            font-weight: 700;
        }

        em,
        .accent {
            font-family: var(--font-accent);
            font-style: italic;
            font-weight: 400;
            color: var(--navy-lt);
        }

        ::selection {
            background: var(--pop);
            color: var(--navy);
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--surface);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            gap: 3px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: width .22s ease, min-width .22s ease, padding .22s ease;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: var(--sidebar-w-collapsed);
            min-width: var(--sidebar-w-collapsed);
            padding: 20px 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 18px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .sidebar.collapsed .brand {
            justify-content: center;
            padding: 4px 0 18px;
        }

        .brand .mark-logo {
            height: 32px;
            width: auto;
            display: block;
            flex-shrink: 0;
        }

        .sidebar.collapsed .brand .mark-logo {
            display: none;
        }

        .brand .mark-badge {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: var(--navy);
            align-items: center;
            justify-content: center;
            color: var(--pop);
            flex-shrink: 0;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 17px;
            box-shadow: var(--shadow-navy);
        }

        .sidebar.collapsed .brand .mark-badge {
            display: flex;
        }

        .brand .txt {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar.collapsed .brand .txt {
            display: none;
        }

        .brand b {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.15;
            letter-spacing: -.02em;
        }

        .brand b i {
            font-family: var(--font-accent);
            font-style: italic;
            font-weight: 400;
            color: var(--crimson);
        }

        .brand small {
            display: block;
            font-size: 9px;
            color: var(--faint);
            font-weight: 700;
            letter-spacing: .09em;
            text-transform: uppercase;
            font-family: var(--font-mono);
            margin-top: 1px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            color: var(--muted);
            font-size: 13.5px;
            font-weight: 700;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: background .15s, color .15s, transform .1s;
        }

        .nav:hover {
            background: var(--surface-2);
            color: var(--navy);
        }

        .nav:active {
            transform: scale(.97);
        }

        .nav.active {
            background: var(--navy);
            color: var(--pop);
        }

        .nav .ic {
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .nav .lbl {
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar.collapsed .nav {
            justify-content: center;
            padding: 11px 0;
            gap: 0;
        }

        .sidebar.collapsed .nav .lbl {
            display: none;
        }

        /* FIX (catatan #1/#9): tombol collapse sidebar sebelumnya position:absolute
   DI DALAM .sidebar yang overflow-y:auto — karena browser otomatis nge-clip
   overflow-x juga begitu overflow-y diset (bukan 'visible'), tombolnya
   (right:-14px, nongol keluar box sidebar) ke-crop/ketutup. Sekarang tombol
   dijadikan sibling .sidebar (lihat initSidebarCollapse di JS, di-insert
   pakai insertAdjacentElement('afterend', ...)) dan position:fixed relatif
   ke viewport, jadi selalu nongol paling depan & gak pernah ke-clip. */
        .sidebar-toggle {
            position: fixed;
            top: 24px;
            left: calc(var(--sidebar-w) - 14px);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--navy);
            color: var(--pop);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 2px 2px 0 var(--pop);
            z-index: 150;
            transition: left .22s ease;
            padding: 0;
            font-family: var(--font-body);
        }

        .sidebar-toggle:active {
            transform: scale(.92);
        }

        .sidebar.collapsed~.sidebar-toggle {
            left: calc(var(--sidebar-w-collapsed) - 14px);
        }

        .sidebar.collapsed~.sidebar-toggle .arrow {
            transform: rotate(180deg);
        }

        .sidebar-toggle .arrow {
            display: inline-block;
            transition: transform .22s ease;
        }

        .nav-external {
            margin-top: auto;
            padding-top: 12px;
            border-top: 2px dashed #E4DECF;
            text-decoration: none;
            display: none;
        }

        .nav-external.show {
            display: flex;
        }

        .nav-external .ic {
            color: var(--gold);
        }

        .nav-external:hover {
            background: var(--pop-soft);
            color: var(--navy);
        }

        .nav-external.ready {
            background: var(--pop-soft);
            color: var(--navy);
        }

        .nav-external.ready .ic {
            color: var(--gold-dim);
        }

        .streak-chip {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 14px 7px 7px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-pill);
            box-shadow: 3px 3px 0 var(--gold);
        }

        .streak-chip .bic {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }

        .streak-chip .bname {
            font-size: 11px;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.2;
        }

        .streak-chip .bpts {
            font-size: 9.5px;
            color: var(--muted);
            font-family: var(--font-mono);
        }

        .main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            min-height: 100dvh;
            min-width: 0;
            transition: margin-left .22s ease;
        }

        .sidebar.collapsed~.main {
            margin-left: var(--sidebar-w-collapsed);
        }

        /* FIX (catatan #2): border-bottom biar pas discroll, konten yg lewat di
   bawah topbar keliatan jelas batasnya (nggak nembus/kepotong polos)
   karena sebelumnya warnanya nyatu sama background. */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--paper);
            padding: calc(18px + var(--safe-top)) 26px 12px;
            display: flex;
            align-items: flex-end;
            gap: 14px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
        }

        .topbar h1 {
            font-size: clamp(20px, 3vw, 26px);
            font-weight: 700;
            color: var(--navy);
            letter-spacing: -.02em;
        }

        .topbar .sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
            font-weight: 500;
        }

        .topbar .grow {
            flex: 1;
        }

        .scroll {
            padding: 14px 26px calc(40px + var(--safe-bottom));
        }

        .card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
        }

        .pad {
            padding: 20px;
        }

        .doc-wrap {}

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .kpi {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: 3px 3px 0 var(--accent, var(--navy));
        }

        .kpi .lbl {
            font-size: 10px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            font-family: var(--font-mono);
        }

        .kpi .val {
            font-size: 28px;
            font-weight: 700;
            color: var(--navy);
            margin-top: 5px;
            font-family: var(--font-display);
            letter-spacing: -.01em;
        }

        .sec-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0 12px;
            flex-wrap: wrap;
        }

        .sec-head h2 {
            font-size: 16.5px;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: -.01em;
        }

        .sec-head .grow {
            flex: 1;
        }

        .chip {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: var(--radius-pill);
            background: var(--surface-2);
            color: var(--navy-lt);
            display: inline-block;
            border: 1.5px solid transparent;
        }

        .chip.gold {
            background: #FFF1D6;
            color: #8A5A0F;
            border-color: #F0D190;
        }

        .chip.crimson {
            background: #FFE3DE;
            color: var(--crimson-dim);
            border-color: #FFC5BA;
        }

        .pill {
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: var(--radius-pill);
            display: inline-block;
            border: 1.5px solid var(--border);
            cursor: pointer;
            font-family: var(--font-body);
        }

        .pill.tercapai {
            background: #E1F7E9;
            color: var(--ok);
            border-color: #B8EAC9;
        }

        .pill.progress {
            background: var(--surface-2);
            color: var(--navy-lt);
            border-color: #DACCFF;
        }

        .pill.gagal {
            background: #FFE3DE;
            color: var(--crimson-dim);
            border-color: #FFC5BA;
        }

        .pill.default {
            background: #F1EFF5;
            color: var(--muted);
            border-color: #E2DEEC;
        }

        .owl-quote {
            background: var(--navy);
            color: #fff;
            border-radius: var(--radius);
            border: 2px solid var(--border);
            padding: 26px 26px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 6px 6px 0 var(--pop);
        }

        .owl-quote::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -40px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(42, 80, 136, .45), transparent 70%);
        }

        .owl-quote::after {
            content: '🦉';
            position: absolute;
            right: -4px;
            bottom: -24px;
            font-size: 110px;
            opacity: .09;
            transform: rotate(-8deg);
        }

        .owl-quote .eyebrow {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--pop);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .owl-quote .role {
            font-family: var(--font-accent);
            font-style: italic;
            font-weight: 400;
            font-size: clamp(23px, 4.5vw, 30px);
            margin-top: 8px;
            line-height: 1.18;
            position: relative;
            z-index: 1;
        }

        .owl-quote .line {
            font-size: 13px;
            color: #D9D2EE;
            margin-top: 10px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .owl-quote .line b {
            color: var(--pop);
            font-weight: 700;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px 20px;
        }

        .kv .k {
            font-size: 10px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .05em;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .kv .v {
            font-size: 14.5px;
            font-weight: 700;
            margin-top: 4px;
            color: var(--text);
        }

        .swot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .swot-box {
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border: 2px solid var(--border);
        }

        .swot-box.s {
            background: #E1F7E9;
        }

        .swot-box.w {
            background: #FFF1D6;
        }

        .swot-box.o {
            background: var(--surface-2);
        }

        .swot-box.t {
            background: #FFE3DE;
        }

        .swot-box .t-lbl {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .swot-box ul {
            padding-left: 16px;
            font-size: 12.5px;
            line-height: 1.6;
        }

        .seg {
            display: inline-flex;
            gap: 3px;
            background: var(--surface-2);
            padding: 4px;
            border-radius: var(--radius-pill);
            flex-wrap: wrap;
            max-width: 100%;
            overflow-x: auto;
            border: 1.5px solid #E2D9FF;
        }

        .seg button {
            padding: 8px 14px;
            border: none;
            background: transparent;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            font-family: var(--font-body);
            white-space: nowrap;
        }

        .seg button.active {
            background: var(--navy);
            color: var(--pop);
        }

        .seg button.disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* FIX (catatan #7): grid nyebar rata selebar box, bukan pill nempel kiri */
        .week-pill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
            gap: 5px;
            background: var(--surface-2);
            padding: 5px;
            border-radius: 14px;
            border: 1.5px solid #E2D9FF;
        }

        .week-pill-grid button {
            padding: 9px 4px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            font-family: var(--font-mono);
            text-align: center;
        }

        .week-pill-grid button.active {
            background: var(--navy);
            color: var(--pop);
        }

        .goal-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-left: 5px solid var(--navy-lt);
            border-radius: var(--radius-sm);
            padding: 15px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }

        .goal-card .gname {
            font-weight: 700;
            font-size: 13.5px;
            color: var(--text);
        }

        .goal-card .gmeta {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* FIX (catatan #13): teks SMART goal dibikin font normal, bukan italic serif */
        .goal-card .smart {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.5;
            font-family: var(--font-body);
            font-style: normal;
        }

        .tbl-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        .tbl th {
            font-size: 10px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: .04em;
            font-weight: 700;
            text-align: left;
            padding: 11px 12px;
            font-family: var(--font-mono);
            background: var(--navy);
        }

        .tbl td {
            padding: 12px;
            font-size: 12.5px;
            border-bottom: 2px solid var(--border);
            vertical-align: middle;
        }

        .tbl tr:nth-child(even) td {
            background: var(--surface-2);
        }

        .tbl tr:last-child td {
            border-bottom: none;
        }

        .tactic-goal {
            margin-bottom: 22px;
        }

        .tactic-goal .gname {
            font-family: var(--font-display);
            font-size: 16.5px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .btn {
            padding: 9px 16px;
            border-radius: var(--radius-pill);
            border: 2px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-body);
            transition: transform .1s;
        }

        .btn:active {
            transform: scale(.96);
        }

        .btn.sm {
            padding: 6px 11px;
            font-size: 11px;
        }

        .btn.primary {
            background: var(--navy);
            color: #fff;
            box-shadow: 3px 3px 0 var(--navy-lt);
        }

        .btn.gold {
            background: var(--gold);
            color: var(--navy);
            box-shadow: 3px 3px 0 var(--navy);
        }

        .btn.ghost {
            background: transparent;
            border-color: #E2DEEC;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .start-date-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-2);
            padding: 8px 12px;
            border-radius: var(--radius-pill);
            flex-wrap: wrap;
            border: 1.5px solid #E2D9FF;
        }

        .start-date-box input {
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 6px 9px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .week-hero {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 14px 18px;
            margin: 14px 0 12px;
            box-shadow: 4px 4px 0 var(--navy-lt);
        }

        .week-hero .wk-num {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            background: var(--navy);
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .week-hero .wk-label {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            color: var(--navy);
        }

        .week-hero .wk-range {
            font-size: 11px;
            color: var(--muted);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .tk-task {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 13px 16px;
            margin-bottom: 12px;
        }

        .tk-task:not(:last-child) {
            border-bottom: 2px solid var(--border);
        }

        .tk-task-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 9px;
            flex-wrap: wrap;
        }

        .tk-task-top .tname {
            flex: 1;
            font-size: 13px;
            font-weight: 700;
            min-width: 160px;
        }

        .tk-days {
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
        }

        .day-box {
            flex: 1 1 0;
            min-width: 0;
            max-width: 44px;
            aspect-ratio: 1;
            border-radius: 9px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: var(--faint);
            cursor: pointer;
            flex-direction: column;
            transition: all .12s;
            user-select: none;
            background: var(--surface);
        }

        .day-box .dlbl {
            font-size: 7.5px;
        }

        .day-box.checked {
            background: var(--navy);
            border-color: var(--navy);
            color: var(--pop);
        }

        .day-box.lockedday {
            cursor: not-allowed;
            opacity: .35;
        }

        .day-box:not(.lockedday):hover {
            border-color: var(--navy-lt);
        }

        .bar {
            height: 8px;
            background: var(--surface-2);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 9px;
            border: 1.5px solid #E2D9FF;
        }

        .bar>i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--crimson));
            border-radius: 20px;
            transition: width .2s;
        }

        .week-range {
            font-size: 11px;
            color: var(--faint);
            font-family: var(--font-mono);
            margin-left: 8px;
        }

        .tk-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .report-cover {
            background: var(--navy);
            color: #fff;
            border-radius: var(--radius);
            border: 2px solid var(--border);
            padding: clamp(24px, 5vw, 34px);
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: 6px 6px 0 var(--crimson);
        }

        .report-cover::after {
            content: '';
            position: absolute;
            right: -40px;
            top: -40px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 241, 59, .18), transparent 70%);
        }

        .report-cover .tag {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--pop);
            font-weight: 700;
        }

        .report-cover h1 {
            font-size: clamp(24px, 5vw, 30px);
            font-weight: 700;
            margin-top: 8px;
        }

        .report-cover .meta {
            font-size: 12.5px;
            color: #D5CCEC;
            margin-top: 10px;
            line-height: 1.7;
        }

        .report-cover .meta b {
            color: #fff;
        }

        .report-kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 26px;
        }

        .report-kpi {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }

        .report-kpi .n {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: var(--navy);
        }

        .report-kpi .l {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .04em;
            font-weight: 700;
            margin-top: 4px;
            font-family: var(--font-mono);
        }

        .report-section {
            margin-bottom: 26px;
        }

        .report-section .sh {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--navy);
        }

        .report-section .sh h3 {
            font-size: 15px;
            color: var(--navy);
        }

        .report-section .sh .count {
            margin-left: auto;
            font-size: 11px;
            color: var(--muted);
            font-family: var(--font-mono);
        }

        .rtbl {
            width: 100%;
            border-collapse: collapse;
            min-width: 420px;
        }

        .rtbl th {
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #fff;
            text-align: left;
            padding: 8px 10px;
            font-family: var(--font-mono);
            background: var(--navy);
        }

        .rtbl td {
            padding: 10px;
            font-size: 12px;
            border-bottom: 2px solid var(--border);
        }

        .rtbl tr:nth-child(even) td {
            background: var(--surface-2);
        }

        .rtbl tr.overdue td:first-child {
            border-left: 4px solid var(--crimson);
        }

        .rtbl tr.overdue td {
            background: #FFF1EE;
        }

        .report-footer {
            font-size: 10.5px;
            color: var(--faint);
            text-align: center;
            margin-top: 30px;
            font-family: var(--font-mono);
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
            gap: 10px;
        }

        .badge-cell {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            background: var(--surface);
        }

        .badge-cell .bic {
            font-size: 26px;
        }

        .badge-cell .bn {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }

        .badge-cell .bd {
            font-size: 9.5px;
            color: var(--muted);
            margin-top: 2px;
        }

        .id-strengths li,
        .id-weak li {
            margin-left: 16px;
            font-size: 12.5px;
            line-height: 1.8;
        }

        .exec-summary {
            margin-bottom: 20px;
        }

        .es-block {
            display: flex;
            gap: 14px;
            padding: 16px 0;
        }

        .es-block:not(:last-child) {
            border-bottom: 2px dashed var(--surface-2);
        }

        .es-num {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--pop);
            color: var(--navy);
            font-family: var(--font-display);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid var(--border);
        }

        .es-body {
            flex: 1;
            min-width: 0;
        }

        .es-body p {
            font-size: 13px;
            line-height: 1.65;
            margin-bottom: 10px;
            color: var(--text);
        }

        .es-body p:last-child {
            margin-bottom: 0;
        }

        .es-body ul {
            padding-left: 18px;
            margin-bottom: 10px;
        }

        .es-body li {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text);
            margin-bottom: 2px;
        }

        .es-body ul:last-child {
            margin-bottom: 0;
        }

        .tk-goal-wrap {
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 20px;
            background: var(--paper);
        }

        .tk-goal-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--navy);
            color: #fff;
            border-radius: 14px;
            padding: 13px 16px;
            margin-bottom: 14px;
            box-shadow: 4px 4px 0 var(--pop);
        }

        .tk-goal-heading .gh-ic {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--navy-lt);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .tk-goal-heading .gh-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            line-height: 1.35;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 7, 20, .6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
        }

        .overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            border: 2px solid var(--border);
            padding: 24px;
            width: 440px;
            max-width: 100%;
            max-height: 86vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            box-shadow: 8px 8px 0 var(--navy-lt);
        }

        /* FIX (catatan #4): modal kalender dilebarin biar gak sempit */
        .modal.wide {
            width: 600px;
        }

        .input {
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            font-family: var(--font-body);
            font-size: 13px;
            width: 100%;
        }

        /* FIX (catatan #4): grid rata kiri-kanan selebar kolom lain (title/textarea),
   bukan flex-wrap yg numpuk kiri sisa kosong di kanan */
        .day-pick {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            background: var(--surface-2);
            border-radius: 10px;
            padding: 7px 4px;
            cursor: pointer;
            border: 1.5px solid #E2D9FF;
        }

        .day-pill input {
            accent-color: var(--navy);
        }

        .day-pill.sm {
            padding: 5px 3px;
            font-size: 9px;
        }

        .day-pill:has(input:checked) {
            background: var(--navy);
            color: var(--pop);
        }

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(255, 248, 236, .85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            gap: 10px;
            font-weight: 700;
            color: var(--navy);
        }

        .loading.on {
            display: flex;
        }

        .spin {
            width: 22px;
            height: 22px;
            border: 3px solid var(--border);
            border-top-color: var(--navy-lt);
            border-radius: 50%;
            animation: sp .7s linear infinite;
        }

        @keyframes sp {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: calc(20px + var(--nav-h) + var(--safe-bottom));
            right: 20px;
            background: var(--navy);
            color: #fff;
            padding: 12px 18px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 700;
            z-index: 400;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            box-shadow: 3px 3px 0 var(--pop);
        }

        .toast.on {
            opacity: 1;
        }

        .empty {
            color: var(--faint);
            font-size: 12.5px;
            padding: 24px;
            text-align: center;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .fatal-banner {
            display: none;
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: calc(16px + var(--nav-h) + var(--safe-bottom));
            z-index: 900;
            background: #fff;
            border: 2px solid var(--crimson);
            border-left: 6px solid var(--crimson);
            border-radius: 14px;
            padding: 16px 18px;
            box-shadow: 5px 5px 0 var(--crimson);
            max-width: 560px;
            margin: 0 auto;
        }

        .fatal-banner.show {
            display: block;
        }

        .fatal-banner .ft {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 13.5px;
            color: var(--crimson-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fatal-banner .fd {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            line-height: 1.6;
            word-break: break-word;
        }

        .fatal-banner .fx {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--faint);
        }

        /* ============================================================
   PATCH MOBILE — tabel jadi kartu bertumpuk (label:value) di layar
   sempit, BUKAN sekadar tabel di-scroll horizontal. Semua tombol,
   select, onclick di dalamnya TIDAK berubah — cuma <td> nambah
   atribut data-label (lihat perubahan JS di bawah).
   ============================================================ */
        @media(max-width:680px) {
            .tbl-wrap {
                overflow-x: visible;
            }

            .tbl,
            .rtbl {
                display: block;
                min-width: 0;
            }

            .tbl thead,
            .rtbl thead {
                display: none;
            }

            .tbl tbody,
            .rtbl tbody {
                display: block;
            }

            .tbl tr,
            .rtbl tr {
                display: block;
                background: var(--surface);
                border: 2px solid var(--border);
                border-radius: 14px;
                padding: 10px 12px;
                margin-bottom: 10px;
                box-shadow: var(--shadow-card);
            }

            .tbl tr:nth-child(even) td,
            .rtbl tr:nth-child(even) td {
                background: transparent;
            }

            .tbl td,
            .rtbl td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                padding: 7px 0;
                border-bottom: 1px dashed var(--surface-2);
                text-align: right;
            }

            .tbl td:last-child,
            .rtbl td:last-child {
                border-bottom: none;
            }

            .tbl td::before,
            .rtbl td::before {
                content: attr(data-label);
                font-size: 10px;
                font-weight: 700;
                color: var(--faint);
                text-transform: uppercase;
                letter-spacing: .04em;
                font-family: var(--font-mono);
                text-align: left;
                flex-shrink: 0;
            }

            .rtbl tr.overdue {
                border-left: 4px solid var(--crimson);
                background: #FFF1EE;
            }

            .rtbl tr.overdue td:first-child {
                border-left: none;
            }
        }

        @media (max-width:899px) {
            body {
                padding-bottom: calc(var(--nav-h) + var(--safe-bottom));
            }

            .sidebar {
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: auto;
                min-width: 0;
                height: var(--nav-h);
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 2px;
                padding: 6px 6px calc(6px + var(--safe-bottom));
                border-right: none;
                border-top: 2px solid var(--border);
                z-index: 200;
                overflow-x: auto;
                overflow-y: visible;
                -webkit-overflow-scrolling: touch;
            }

            .sidebar.collapsed {
                width: auto;
                min-width: 0;
                padding: 6px 6px calc(6px + var(--safe-bottom));
            }

            .sidebar-toggle {
                display: none;
            }

            .nav-external {
                margin-top: 0;
                padding-top: 6px;
                border-top: none;
            }

            .brand {
                display: none;
            }

            .nav {
                flex-direction: column;
                gap: 2px;
                padding: 6px 4px;
                border-radius: 14px;
                flex: 1;
                min-width: 56px;
                font-size: 9.5px;
            }

            .sidebar.collapsed .nav {
                flex-direction: column;
                padding: 6px 4px;
                gap: 2px;
            }

            .sidebar.collapsed .nav .lbl {
                display: block;
            }

            .nav .ic {
                font-size: 19px;
            }

            .nav .lbl {
                font-size: 9px;
                letter-spacing: -.01em;
            }

            .main,
            .sidebar.collapsed~.main {
                margin-left: 0;
                min-height: 0;
            }

            .scroll {
                padding: 14px 16px 24px;
            }

            .topbar {
                padding: calc(14px + var(--safe-top)) 16px 10px;
            }

            .kpi .val {
                font-size: 24px;
            }
        }

        @media (max-width:520px) {
            .kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .report-kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav .lbl {
                display: none;
            }

            .nav {
                min-width: 44px;
            }

            .day-box .dlbl {
                display: none;
            }

            .week-hero {
                flex-wrap: wrap;
            }
        }

        @media (max-width:899px) and (orientation:landscape) and (max-height:500px) {
            :root {
                --nav-h: 52px;
            }

            .nav {
                flex-direction: row;
                gap: 6px;
            }

            .nav .lbl {
                font-size: 10px;
            }
        }

        /* FIX (catatan #8 & #11): waktu print/save-as-PDF, .main sebelumnya masih
   ke-dorong margin-left:216px padahal sidebarnya udah disembunyikan — bikin
   hasil print keliatan "kepotong". Sekarang margin di-nolin waktu print.
   Spacing report/identity juga dipadetin biar gak jomplang jauh2 (#11). */
        @media print {

            .sidebar,
            .loading,
            .toast,
            .no-print,
            .overlay,
            .fatal-banner,
            .sidebar-toggle {
                display: none !important;
            }

            body,
            html {
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
            }

            .main {
                margin-left: 0 !important;
            }

            .topbar {
                display: none !important;
            }

            .scroll {
                overflow: visible !important;
                height: auto !important;
                padding: 0 !important;
            }

            .view {
                display: none !important;
            }

            body.printing-report #view-report {
                display: block !important;
            }

            body.printing-identity #view-identity {
                display: block !important;
            }

            .card {
                box-shadow: none !important;
            }

            .report-section {
                margin-bottom: 14px;
                break-inside: avoid;
            }

            .report-section .sh {
                margin-bottom: 6px;
                padding-bottom: 5px;
            }

            .es-block {
                padding: 9px 0;
            }

            .card.pad {
                padding: 13px;
            }

            .report-cover {
                padding: 18px;
                margin-bottom: 12px;
            }

            .report-kpi-row {
                margin-bottom: 14px;
                gap: 8px;
            }

            .report-cover::after {
                display: none;
            }

            @page {
                size: A4;
                margin: 14mm;
            }
        }

        /* Pie chart overview (catatan #15) */
        .dream-donut-wrap {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            align-items: center;
        }

        .dream-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .dream-legend .li {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .dream-legend .dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* ── SETUP (Ikigai & SWOT wizard) ── */
        .setup-diri-card {
            background: var(--navy);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 4px 4px 0 var(--pop);
            padding: 20px;
            margin-bottom: 22px;
        }

        .setup-diri-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media(max-width:900px) {
            .setup-diri-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .setup-diri-card label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--pop);
            text-transform: uppercase;
            letter-spacing: .05em;
            font-family: var(--font-mono);
            margin-bottom: 5px;
        }

        .setup-diri-card .input {
            background: #fff;
        }

        .setup-diri-card .ai-field {
            background: var(--pop-soft);
            border-radius: 12px;
            padding: 10px 12px;
            border: 2px solid var(--pop);
        }

        .setup-diri-card .ai-field label {
            color: var(--navy);
        }

        .setup-diri-card .ai-field select.input {
            border-color: var(--navy);
            font-weight: 700;
            background: var(--pop);
        }

        .setup-block {
            margin-bottom: 16px;
        }

        .setup-block+.setup-block {
            border-top: 2px dashed var(--border);
            padding-top: 16px;
        }

        .setup-block-title {
            font-weight: 700;
            font-size: 13.5px;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
        }

        .setup-block-title .num {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: var(--navy);
            color: var(--pop);
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;

        .setup-field {

        .setup-grid3 {

        .swot-col-head {
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: .04em;

            margin-bottom: 8px;
            text-align: center;

        .swot-col-head.s {
            background: #DFF6E4;
            color: #1FA35A;
        }

        .swot-col-head.w {
            background: #FFE3DE;

        .swot-col-head.o {

        .ai-link-cta {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            padding: 13px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12.5px;
            background: var(--pop);
            color: var(--navy);
            border: 2px solid var(--border);
            box-shadow: 3px 3px 0 var(--navy);
            cursor: pointer;
            font-family: var(--font-body);
        }

        .ai-link-cta.disabled {
            background: var(--surface-2);
            color: var(--muted);
            box-shadow: none;
            cursor: default;
            border-style: dashed;
        }

        .skill-item {
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: var(--surface-2);

        .skill-item:last-child {
            margin-bottom: 0;

        .skill-item b {
            font-size: 12.5px;

        }

        .skill-item .note {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 3px;
            line-height: 1.5;
        }

        .career-skill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media(max-width:680px) {
            .career-skill-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── ACTIVATION SCREEN ── selector di-scope ke .activation-screen biar
   gak nimpa style global dashboard (body/h1/input/button dipakai di
   mana-mana di dashboard). */
        .activation-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .activation-screen {
            width: 100%;
            max-width: 380px;
            padding: 28px 26px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-navy);
        }

        .activation-screen h1 {
            font-family: var(--font-body);
            font-size: 19px;
            color: var(--navy);
            margin-bottom: 6px;
            font-weight: 700;
            text-align: center;
        }

        .activation-screen .sub {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 18px;
            line-height: 1.5;
            text-align: center;
        }

        .activation-screen label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 5px;
        }

        .activation-screen input {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 9px;
            padding: 11px 13px;
            font-size: 15px;
            letter-spacing: .06em;
            text-align: center;
            margin-bottom: 14px;
            font-family: var(--font-mono);
        }

        .activation-screen input:focus {
            outline: none;
            border-color: var(--navy-lt);
        }

        .activation-screen button {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            border: 2px solid var(--border);
            background: var(--navy);
            color: var(--pop);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            font-family: var(--font-body);
        }

        .activation-screen button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .activation-screen .msg {
            margin-top: 12px;

            padding: 9px 11px;
            border-radius: 9px;
            display: none;
            text-align: center;
        }

        .activation-screen .msg.err {
            background: #FFE3DE;
            color: #C81B24;
            display: block;
        }

        .activation-screen .msg.ok {
            background: #E1F7E9;
            color: #1FA35A;
            display: block;
        }

        .activation-screen .closebtn {

        @media(max-width:520px) {

    </style>

<body>
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <svg class="mark-logo" viewBox="0 0 160 32" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="ElevatEd">

                <text x="16" y="24" font-size="18" text-anchor="middle">🦉</text>
                <text x="40" y="22" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="17"
                    fill="#143358">Elevat<tspan fill="#E62129" font-style="italic">Ed</tspan></text>
            </svg>
            <span class="mark-badge">E</span>
        </div>
        <button class="nav active" data-view="overview"><span class="ic">🪶</span><span

        <button class="nav" data-view="dream"><span class="ic">🌙</span><span class="lbl">Dream Goals</span></button>
        <button class="nav" data-view="college"><span class="ic">🎓</span><span class="lbl">Misi Kuliah</span></button>
        <button class="nav" data-view="action"><span class="ic">🎯</span><span class="lbl">Action Plan</span></button>
        <button class="nav" data-view="tracker"><span class="ic">✅</span><span class="lbl">Tracker</span></button>
        <button class="nav" data-view="report"><span class="ic">📄</span><span class="lbl">Report</span></button>
        <button class="nav" data-view="identity"><span class="ic">🪪</span><span class="lbl">Identity</span></button>
        <button class="nav" data-view="setup"><span class="ic">🛠️</span><span class="lbl">Setup</span></button>
        <a class="nav nav-external" id="nav-newtab" href="#" rel="noopener"><span class="ic">↗</span><span
                class="lbl">Tab
                Baru</span></a>
    </nav>

    <div class="main">
        <div class="topbar">
            <div>
                <h1 id="pg-title">Overview</h1>
                <div class="sub" id="pg-sub"></div>
            </div>
            <div class="grow"></div>
            <div id="pg-actions"></div>
            <div id="score-widget"></div>
        </div>
        <div class="scroll">
            <section class="view active" id="view-overview">
                <div class="empty">Menghubungkan ke Google Sheets…</div>
            </section>
            <section class="view" id="view-dream"></section>
            <section class="view" id="view-college"></section>
            <section class="view" id="view-action"></section>
            <section class="view" id="view-tracker"></section>
            <section class="view" id="view-report"></section>
            <section class="view" id="view-identity"></section>
            <section class="view" id="view-setup"></section>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal" id="modal"></div>
    </div>
    <div class="loading" id="loading">
        <div class="spin"></div> Memuat…
    </div>
    <div class="toast" id="toast"></div>
    <div class="fatal-banner" id="fatal-banner">
        <button class="fx" id="fatal-close">✕</button>
        <div class="ft">⚠️ Dashboard gagal memuat data</div>
        <div class="fd" id="fatal-detail"></div>
    </div>

    <div class="activation-page">
        <div class="activation-screen">
            <h1>🔑 Aktivasi Akses</h1>
            <div class="sub">Masukin token yang dikirim ke email kamu. Aktivasi bakal terikat ke akun Google yang lagi
                kamu
                pakai login sekarang — pastiin ini akun yang sama waktu kamu beli.</div>
            <label for="tok">Token Aktivasi</label>
            <input id="tok" type="text" placeholder="IKG-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
            <button id="btn" onclick="submitToken()">Aktivasi Sekarang</button>
            <div class="msg" id="msg"></div>
        </div>
    </div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxQs03Uk7Of9srdlaK7KO0bVeNCyjbcF2EM1M5qbvx7MLTxvk8iI0EBA2QsuxN6M3xl/exec";

        function getToken() {
            return localStorage.getItem('user_token') || '';
        }

        async function callApi(action, payload = {}) {
            const token = getToken();
            const body = {
                action: action,
                token: token || (payload && payload.code ? payload.code : ''),
                payload: payload
            };
            const res = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(body)
            });
            const json = await res.json();
            return json;
        }

        const INITIAL_VIEW = 'overview';
        const S = {
            personal: null, dream: null, college: null, action: null, gamification: null, trackerConfig: null,
            tracker: null, webAppUrl: '', curSem: '', curCollegeSem: '', curCollegeCat: '', curAPQuarter: 'Q1', curTrackerQuarter: 'Q1',
            setup: null
        };
        let curWeekIdx = 0;

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function showLoad(on) { document.getElementById('loading').classList.toggle('on', on); }
        function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400); }
        function pillClass(status) { const s = String(status).toLowerCase(); if (s.indexOf('tercapai') >= 0 || s.indexOf('selesai') >= 0) return 'tercapai'; if (s.indexOf('progress') >= 0 || s.indexOf('berjalan') >= 0) return 'progress'; if (s.indexOf('gagal') >= 0) return 'gagal'; return 'default'; }

        // FIX (catatan #12): window.open() polos sering keblokir popup-blocker di HP
        // (khususnya dari dalam iframe sandbox GAS). Klik anchor asli lebih tahan
        // banting dibanding window.open() lewat script.
        function openExternal_(url) {
            const a = document.createElement('a');
            a.href = url; a.target = '_blank'; a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function showFatal(msg) {
            const box = document.getElementById('fatal-banner');
            document.getElementById('fatal-detail').textContent = msg;
            box.classList.add('show');
            showLoad(false);
            try { console.error('[ElevatEd fatal]', msg); } catch (e) { }
        }
        const onFatal = showFatal;
        document.getElementById('fatal-close').addEventListener('click', () => {
            document.getElementById('fatal-banner').classList.remove('show');
        });
        window.addEventListener('error', e => {
            showFatal((e && e.message) ? e.message : 'Terjadi error JavaScript yang nggak terduga.');
        });

        function onErr(e) {
            const msg = (e && e.message) ? e.message : String(e || 'Respons server kosong.');
            showLoad(false);
            showFatal(msg);
        }
        function modalOpen(html, wide) {
            const modal = document.getElementById('modal');
            modal.innerHTML = html;
            modal.classList.toggle('wide', !!wide);
            document.getElementById('overlay').classList.add('open');
        }
        function modalClose() { document.getElementById('overlay').classList.remove('open'); }
        document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') modalClose(); });

        // FIX (catatan #1/#9): tombol collapse ditaruh sebagai SIBLING dari .sidebar
        // (bukan child-nya) biar gak ke-clip sama overflow-y:auto milik .sidebar.
        function initSidebarCollapse() {
            const sidebar = document.getElementById('sidebar');
            let collapsed = false;
            try { collapsed = localStorage.getItem('elevated_sidebar_collapsed') === '1'; } catch (e) { }
            if (collapsed) sidebar.classList.add('collapsed');

            const btn = document.createElement('button');
            btn.className = 'sidebar-toggle';
            btn.type = 'button';
            btn.setAttribute('aria-label', 'Collapse / lebarkan sidebar');
            btn.innerHTML = '<span class="arrow">‹</span>';
            btn.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                try { localStorage.setItem('elevated_sidebar_collapsed', sidebar.classList.contains('collapsed') ? '1' : '0'); } catch (e) { }
            });
            sidebar.insertAdjacentElement('afterend', btn);
        }

        // Link "buka di tab baru" nempel di sidebar (nav item paling bawah).
        // Klik pertama TIDAK langsung navigasi — backend dipanggil dulu buat
        // ngecek URL Web App yang lagi jalan beneran bisa diakses (fetch ulang ke
        // dirinya sendiri, cek status 200), biar nggak ada kejadian link mati/versi
        // lama pas diklik. Baru klik ke-2 (setelah status "siap") yang benar-benar
        // buka tab baru. Kalau URL-nya kosong dari awal (mis. dibuka lewat modal
        // dialog di Sheets, bukan sebagai Web App), tombolnya disembunyikan total.
        let newTabState_ = 'idle'; // idle | checking | ready
        function initNewTabButton_(url) {
            const a = document.getElementById('nav-newtab');
            if (!a) return;
            if (!url) { a.classList.remove('show'); return; }
            a.classList.add('show');
            a.addEventListener('click', function (ev) {
                ev.preventDefault();
                if (newTabState_ === 'checking') return;
                if (newTabState_ === 'ready' && a.dataset.verifiedUrl) {
                    openExternal_(a.dataset.verifiedUrl);
                    resetNewTabButton_(a);
                    return;
                }
                checkNewTabLink_(a);
            });
        }
        function setNewTabLabel_(a, text) {
            const lbl = a.querySelector('.lbl');
            if (lbl) lbl.textContent = text;
        }
        async function checkNewTabLink_(a) {
            newTabState_ = 'checking';
            a.classList.remove('ready');
            a.classList.add('checking');
            setNewTabLabel_(a, 'Mengecek link…');
            try {
                const r = await callApi('verifyWebAppUrl');
                if (r && r.ok) {
                    newTabState_ = 'ready';
                    a.dataset.verifiedUrl = r.url;
                    a.classList.remove('checking');
                    a.classList.add('ready');
                    setNewTabLabel_(a, 'Klik lagi buat buka ↗');
                    toast('✅ Link siap — klik sekali lagi buat buka tab baru');
                    clearTimeout(a._resetTimer);
                    a._resetTimer = setTimeout(function () { resetNewTabButton_(a); }, 15000);
                } else {
                    resetNewTabButton_(a);
                    toast('❌ ' + (r && r.error ? r.error : 'Link web app belum bisa diakses.'));
                }
            } catch (err) {
                resetNewTabButton_(a);
                toast('❌ Gagal ngecek link: ' + (err && err.message ? err.message : err));
            }
        }
        function resetNewTabButton_(a) {
            newTabState_ = 'idle';
            a.classList.remove('checking', 'ready');
            delete a.dataset.verifiedUrl;
            setNewTabLabel_(a, 'Tab Baru');
            clearTimeout(a._resetTimer);
        }

        function formatAiSummary_(raw) {
            const text = String(raw || '').trim();
            if (!text) return '';
            const blocks = text.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
            let html = '';
            blocks.forEach(block => {
                const startsWithBullet = /^[-•]\s/.test(block);
                const parts = block.split(/\s+[-•]\s+/).map(p => p.trim()).filter(Boolean);
                if (startsWithBullet) {
                    const items = parts.map(p => p.replace(/^[-•]\s*/, ''));
                    html += '<ul>' + items.map(it => `<li>${esc(it)}</li>`).join('') + '</ul>';
                } else if (parts.length > 1) {
                    const intro = parts[0], items = parts.slice(1);
                    html += `<p>${esc(intro)}</p><ul>` + items.map(it => `<li>${esc(it)}</li>`).join('') + '</ul>';
                } else {
                    html += `<p>${esc(block)}</p>`;
                }
            });
            return html;
        }

        let bootStarted = false;
        let bootTimer = null;
        function validInitialView_() {
            return INITIAL_VIEW || 'overview';
        }
        function bindNavigation_() {
            document.querySelectorAll('.nav[data-view]').forEach(n => {
                n.addEventListener('click', () => go(n.dataset.view));
            });
        }
        async function startDashboard_() {
            if (bootStarted) return;
            bootStarted = true;
            initSidebarCollapse();
            bindNavigation_();
            go(validInitialView_());
            showLoad(true);

            bootTimer = setTimeout(() => {
                showFatal('Koneksi ke server terlalu lama. Refresh halaman lalu pastikan koneksi internet stabil.');
            }, 30000);

            try {
                const b = await callApi('getInitialBundle');
                clearTimeout(bootTimer);
                if (!b || !b.success) {
                    showLoad(false);
                    onFatal(b && b.error ? b.error : 'Gagal memuat data awal');
                    return;
                }
                S.personal = b.personal; S.dream = b.dream; S.college = b.college;
                S.gamification = b.gamification; S.trackerConfig = b.trackerConfig;
                S.webAppUrl = b.webAppUrl || '';
                S.action = null;
                renderScoreWidget();
                initNewTabButton_(S.webAppUrl);
                showLoad(false);
                go(validInitialView_());
            } catch (err) {
                clearTimeout(bootTimer);
                showLoad(false);
                onErr(err);
            }
        }
        async function ensureActionLoaded_(cb) {
            if (S.action) { cb(); return; }
            showLoad(true);
            try {
                const r = await callApi('getActionPlanOnly');
                showLoad(false);
                if (r && r.action) { S.action = r.action; }
                cb();
            } catch (e) {
                showLoad(false);
                onErr(e);
            }
        }
        function renderScoreWidget() {
            const g = S.gamification; if (!g) return;
            document.getElementById('score-widget').innerHTML = `<div class="streak-chip"><span class="bic">${g.badge.icon}</span><div><div class="bname">${esc(g.badge.name)}</div><div class="bpts">${g.total} poin${g.nextBadge ? ' · ' + (g.nextBadge.min - g.total) + ' lg ke ' + esc(g.nextBadge.name) : ''}</div></div></div>`;
        }
        async function refreshGamification() {
            try {
                const g = await callApi('getGamificationOnly');
                if (g) { S.gamification = g; renderScoreWidget(); }
            } catch (e) { }
        }

        // ── Donut chart Dream Goals (catatan #15) — SVG murni, ga perlu library ──
        function buildDreamDonut_(summary) {
            const total = summary.total || 0;
            if (!total) {
                return { svg: '<div class="empty" style="padding:20px 6px;">Belum ada goal</div>', legend: '' };
            }
            const segs = [
                { label: 'Tercapai', val: summary.tercapai, color: 'var(--ok)' },
                { label: 'On Progress', val: summary.onProgress, color: 'var(--navy-lt)' },
                { label: 'Gagal', val: summary.gagal, color: 'var(--crimson)' },
                { label: 'Lainnya', val: summary.lainnya, color: '#D8D2E8' },
            ].filter(s => s.val > 0);
            const r = 42, cx = 54, cy = 54, circ = 2 * Math.PI * r;
            let offset = 0;
            const arcs = segs.map(s => {
                const len = (s.val / total) * circ;
                const rot = (offset / circ) * 360 - 90;
                offset += len;
                return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${s.color}" stroke-width="15" stroke-dasharray="${len} ${circ - len}" transform="rotate(${rot} ${cx} ${cy})"/>`;
            }).join('');
            const svg = `<svg viewBox="0 0 108 108" width="118" height="118">${arcs}<circle cx="${cx}" cy="${cy}" r="${r - 9}" style="fill:var(--surface)"/><text x="${cx}" y="${cy - 1}" text-anchor="middle" style="font-family:var(--font-display);font-weight:700;font-size:20px;fill:var(--navy)">${total}</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" style="font-family:var(--font-mono);font-size:7px;fill:var(--faint)">GOALS</text></svg>`;
            const legend = `<div class="dream-legend">${segs.map(s => `<div class="li"><span class="dot" style="background:${s.color}"></span>${esc(s.label)} (${s.val})</div>`).join('')}</div>`;
            return { svg, legend };
        }

        function renderOverview() {
            const p = S.personal;
            if (!p) { document.getElementById('view-overview').innerHTML = '<div class="empty">Data personal belum ketemu. Cek sheet IKIGAI.</div>'; return; }
            const d = S.dream || { summary: { total: 0, onProgress: 0, tercapai: 0, gagal: 0, lainnya: 0 } };
            const donut = buildDreamDonut_(d.summary);
            const collegeCount = S.college ? S.college.missions.length : 0;
            document.getElementById('view-overview').innerHTML = `
    <div class="owl-quote">
      <div class="eyebrow">Sweetspot Ikigai Kamu</div>
      <div class="role">${esc(p.sweetspot || 'Sweetspot belum dipilih')}</div>
      <div class="line">Ikigai spot-ku: <b>${esc(p.ikigaiSpot || '-')}</b></div>
      <div class="line" style="margin-top:8px;">"${esc(p.sliceOfLife || '-')}"</div>
    </div>
    ${(p.ikigaiSummary || p.swotSummary) ? `
    <div class="card pad exec-summary">
      <div class="sec-head" style="margin-top:0;"><h2>Executive Summary</h2></div>
      ${p.ikigaiSummary ? `<div class="es-block"><div class="es-num">1</div><div class="es-body">${formatAiSummary_(p.ikigaiSummary)}</div></div>` : ''}
      ${p.swotSummary ? `<div class="es-block"><div class="es-num">2</div><div class="es-body">${formatAiSummary_(p.swotSummary)}</div></div>` : ''}

        const GCAL_DAY_CODE = { Senin: 'MO', Selasa: 'TU', Rabu: 'WE', Kamis: 'TH', Jumat: 'FR', Sabtu: 'SA', Minggu: 'SU' };
        const GCAL_DAY_JS = { Minggu: 0, Senin: 1, Selasa: 2, Rabu: 3, Kamis: 4, Jumat: 5, Sabtu: 6 };
        function fmtGCalDate_(d) { return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z'; }
        function trackerStartDate_() { return S.trackerConfig ? new Date(S.trackerConfig.startDate) : new Date(); }

        // FIX (catatan #4): dukung tipe pengulangan Google Calendar yg standar
        // (Setiap Hari/Minggu/Bulan/Tahun) + Custom (pilih hari + deadline manual).
        // freqType: 'DAILY' | 'WEEKLY' | 'MONTHLY' | 'YEARLY' | 'CUSTOM'
        function buildGCalUrl_(title, desc, freqType, weekdays, startTimeStr, endTimeStr, untilDateStr) {
            const start = trackerStartDate_();
            const sp = (startTimeStr || '19:00').split(':').map(Number);
            const ep = (endTimeStr || '20:00').split(':').map(Number);
            const needsByday = (freqType === 'WEEKLY' || freqType === 'CUSTOM');
            let firstDate = new Date(start);
            if (needsByday) {
                const targetDows = (weekdays || []).map(w => GCAL_DAY_JS[w]);
                let guard = 0;
                while (targetDows.indexOf(firstDate.getDay()) < 0 && guard < 8) { firstDate.setDate(firstDate.getDate() + 1); guard++; }
            }
            firstDate.setHours(sp[0] || 19, sp[1] || 0, 0, 0);
            const endDate = new Date(firstDate);
            endDate.setHours(ep[0] || 20, ep[1] || 0, 0, 0);
            if (endDate <= firstDate) endDate.setDate(endDate.getDate() + 1);
            const until = new Date((untilDateStr || defaultUntilStr_()) + 'T23:59:00');
            let rrule;
            if (needsByday) {
                const byday = (weekdays || []).map(w => GCAL_DAY_CODE[w]).filter(Boolean).join(',');
                rrule = 'FREQ=WEEKLY;BYDAY=' + byday + ';UNTIL=' + fmtGCalDate_(until);
            } else {
                rrule = 'FREQ=' + freqType + ';UNTIL=' + fmtGCalDate_(until);
            }
            const params = new URLSearchParams({
                action: 'TEMPLATE', text: title,
                dates: fmtGCalDate_(firstDate) + '/' + fmtGCalDate_(endDate),
                details: desc,
                recur: 'RRULE:' + rrule,
            });
            return 'https://calendar.google.com/calendar/render?' + params.toString();
        }

        function drawTrackerWeek() {
            const tv = S.tracker; const week = tv.weeks[curWeekIdx];
            document.getElementById('tk-current-week').innerHTML = `<div class="wk-num">${esc(week.w)}</div><div><div class="wk-label">${esc(week.label)}</div><div class="wk-range">${esc(week.rangeLabel)}</div></div>`;

            if (!tv.goals.length) { body.innerHTML = '<div class="empty">Belum ada taktik di quarter ini. Isi dulu di Action Plan.</div>'; return; }
            // FIX (catatan #3): taktik biweekly/bulanan SEKARANG TETAP MUNCUL di semua
            // minggu (nggak lagi cuma nongol di minggu 1/3/5 dst). Backend udah numpuk
            // 1 periode ke 1 record yang sama, jadi status checked/lock-nya otomatis
            // sinkron di semua minggu dalam periode itu — begitu target periode
            // tercapai di minggu manapun, minggu lain dalam periode itu ikut kelock.
            body.innerHTML = tv.goals.map(g => {
                if (!g.tactics.length) return '';
                return `
      <div class="tk-goal-wrap">
        <div class="tk-goal-heading"><span class="gh-ic">🎯</span><span class="gh-text">${esc(g.goal)}</span></div>
        ${g.tactics.map(t => {
                    const wk = t.weeks[curWeekIdx];
                    const locked = wk.checkedCount >= t.target;
                    const periodEnd = (wk.periodStartWeek || curWeekIdx + 1) + (t.periodWeeks || 1) - 1;
                    const periodChip = t.periodWeeks > 1 ? `<span class="chip">🔁 periode Minggu ${wk.periodStartWeek}–${periodEnd}</span>` : '';
                    return `<div class="tk-task">
            <div class="tk-task-top"><div class="tname">${esc(t.taktik)}</div>${periodChip}<span class="chip ${locked ? 'gold' : ''}">${wk.checkedCount}/${t.target}x</span></div>
            <div class="tk-days">${wk.days.map((checked, di) => `
              <div class="day-box ${checked ? 'checked' : ''} ${(!checked && locked) ? 'lockedday' : ''}"
                data-goal="${g.idx}" data-tactic="${esc(t.no)}" data-week="${wk.week}" data-day="${di}" data-target="${t.target}" data-period="${t.periodWeeks || 1}">
                <span class="dlbl">${week.days[di].name.slice(0, 3)}</span>${checked ? '✓' : ''}
              </div>`).join('')}</div>
            <div class="bar"><i style="width:${Math.min(100, Math.round(wk.checkedCount / t.target * 100))}%"></i></div>
            <div class="tk-actions">
              <button class="btn sm check-all-btn" data-goal="${g.idx}" data-tactic="${esc(t.no)}" data-week="${wk.week}" data-target="${t.target}" data-period="${t.periodWeeks || 1}">✅ Ceklis Semua</button>
              <button class="btn sm ghost reset-week-btn" data-goal="${g.idx}" data-tactic="${esc(t.no)}" data-week="${wk.week}" data-period="${t.periodWeeks || 1}">↺ Reset</button>
            </div>
          </div>`;
                }).join('')}
      </div>`;
            }).join('');
            if (!body.innerHTML.trim()) {
                body.innerHTML = '<div class="empty">Belum ada taktik buat quarter ini.</div>';
            }
