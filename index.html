                el.addEventListener('click', async () => {
                    if (el.classList.contains('lockedday')) { toast('🔒 Target periode ini udah tercapai'); return; }
                    const goalIdx = Number(el.dataset.goal), tacticNo = el.dataset.tactic, week = Number(el.dataset.week), day = Number(el.dataset.day), target = Number(el.dataset.target), period = Number(el.dataset.period) || 1;
                    const willCheck = !el.classList.contains('checked');
                    try {
                        const r = await callApi('toggleTrackerCheck2', { quarter: S.curTrackerQuarter, goalIdx: goalIdx, tacticNo: tacticNo, week: week, dayIndex: day, value: willCheck, target: target, periodWeeks: period });
                        if (!r.success) { toast(r.locked ? '🔒 ' + r.error : 'Gagal: ' + r.error); return; }
                        toast(willCheck ? '✅ Checked' : '↩️ Unchecked');
                        loadTracker(); refreshGamification();
                    } catch (e) {
                        onErr(e);
                    }
                });
            });
            document.querySelectorAll('.check-all-btn').forEach(b => b.addEventListener('click', async () => {
                const goalIdx = Number(b.dataset.goal), tacticNo = b.dataset.tactic, week = Number(b.dataset.week), target = Number(b.dataset.target), period = Number(b.dataset.period) || 1;
                showLoad(true);

                    await callApi('checkAllTrackerWeek', { quarter: S.curTrackerQuarter, goalIdx: goalIdx, tacticNo: tacticNo, week: week, target: target, periodWeeks: period });
                    showLoad(false); toast('✅ Diceklis semua (' + target + 'x)'); loadTracker(); refreshGamification();
                } catch (e) {
                    showLoad(false); onErr(e);
                }
            }));

                const goalIdx = Number(b.dataset.goal), tacticNo = b.dataset.tactic, week = Number(b.dataset.week), period = Number(b.dataset.period) || 1;

                }
            }));
        }

        // Code.gs, whitelist SETUP_FIELDS). Prompt AI-nya sendiri TIDAK
        // ditampilkan (link-nya aja) tapi tetap ditarik LIVE dari formula sheet
        // (A17/A31/SWOT!A17) — begitu inputan berubah & tersimpan, link "Buka di
        // AI" otomatis update kontennya sendiri di balik layar.
        async function ensureSetupLoaded_(cb) {
            if (S.setup) { cb(); return; }
            showLoad(true);
            try {
                const r = await callApi('getSetupBundle');
                S.setup = r; showLoad(false); cb();
            } catch (e) {
                showLoad(false); onErr(e);
            }
        }
        function aiLinkCtaHtml_(promptText, label) {
            if (!promptText) return `<div class="ai-link-cta disabled">🔒 Isi field di atas dulu buat ngaktifin link ini</div>`;
            return `<button class="ai-link-cta ai-open-btn" data-prompt="${esc(promptText)}">🔗 ${esc(label)}</button>`;
        }
        function setupBlockHtml_(num, title, bodyHtml) {
            return `<div class="setup-block">
    <div class="setup-block-title"><span class="num">${num}</span>${esc(title)}</div>
    ${bodyHtml}
  </div>`;
        }
        function buildSetupHtml_() {
            const s = S.setup, ik = s.ikigai, sw = s.swot, ctx = s.context;

            const mbtiDatalist = `<datalist id="dl-mbti">${s.mbtiOptions.map(m => `<option value="${esc(m)}">`).join('')}</datalist>`;
            const viaDatalist = `<datalist id="dl-via">${s.viaOptions.map(v => `<option value="${esc(v.label)}">`).join('')}</datalist>`;

            const diriCard = `
    <div class="setup-diri-card">
      <div class="setup-diri-grid">
        <div><label>Nama</label><input class="input" value="${esc(ctx.name)}" data-field="ctx_name" placeholder="Nama kamu"></div>
        <div><label>Jurusan</label><input class="input" value="${esc(ctx.major)}" data-field="ctx_major" placeholder="Jurusan"></div>
        <div><label>Semester</label><select class="input" data-field="ctx_semester">${s.semesterOptions.map(o => `<option ${o === ctx.semester ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>
        <div><label>Karir Sesuai Jurusan?</label><select class="input" data-field="ctx_linear">${s.linearOptions.map(o => `<option ${o === ctx.linear ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>
      </div>
      <div class="ai-field" style="margin-top:14px;">
        <label>Pilih AI Andalanmu</label>
        <select class="input" id="setup-ai-select">${s.aiOptions.map(o => `<option value="${esc(o.key)}" ${o.key === s.aiChoice ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>
      </div>
    </div>`;

            const step1Body = `
    <div class="setup-field"><label>MBTI (wajib)</label>
      <input class="input" list="dl-mbti" value="${esc(ik.mbti)}" data-field="ik_mbti" placeholder="mis. ENFJ">
    </div>
    <div class="setup-field"><label>Top 3 VIA Character (opsional, makin lengkap makin akurat)</label>
      <div class="setup-grid3">${[0, 1, 2].map(i => `<input class="input" list="dl-via" value="${esc(ik.via[i] || '')}" data-field="ik_via${i + 1}" placeholder="Via #${i + 1}">`).join('')}</div>
    </div>
    <div class="setup-field"><label>Top 3 Career Explorer (opsional)</label>
      <div class="setup-grid3">${[0, 1, 2].map(i => `<input class="input" value="${esc(ik.career[i] || '')}" data-field="ik_career${i + 1}" placeholder="Career #${i + 1}">`).join('')}</div>
    </div>
    ${aiLinkCtaHtml_(ik.prompt1, 'Temukan Ikigai Kamu Disini')}`;

            const step2Body = `
    <div class="setup-field"><label>Ikigai Spot Pilihanmu (paste hasil AI)</label>
      <textarea class="input" rows="2" data-field="ik_spot" placeholder="mis. The Heart-Based Strategist">${esc(ik.spot)}</textarea>
    </div>
    <div class="setup-field"><label>Slice of Life Purpose Pilihanmu</label>
      <textarea class="input" rows="2" data-field="ik_slice" placeholder="1 kalimat yang paling 'kamu banget'">${esc(ik.slice)}</textarea>
    </div>
    ${aiLinkCtaHtml_(ik.prompt2, 'Temukan Sweetspot Career Disini')}`;

            const step3Body = `
    <div class="setup-field"><label>Sweetspot Career Pilihanmu (paste hasil AI)</label>
      <input class="input" value="${esc(ik.sweetspot)}" data-field="ik_sweetspot" placeholder="mis. Youth Coach">
    </div>
    <div class="setup-field"><label>Top 3 Hardskill</label>
      <div class="setup-grid3">${[0, 1, 2].map(i => `<input class="input" value="${esc(ik.hardskills[i] || '')}" data-field="ik_hard${i + 1}" placeholder="Hardskill #${i + 1}">`).join('')}</div>
    </div>
    <div class="setup-field"><label>Top 3 Softskill</label>
      <div class="setup-grid3">${[0, 1, 2].map(i => `<input class="input" value="${esc(ik.softskills[i] || '')}" data-field="ik_soft${i + 1}" placeholder="Softskill #${i + 1}">`).join('')}</div>
    </div>`;

            const swField_ = (field, val, ph) => `<div class="setup-field"><input class="input" value="${esc(val || '')}" data-field="${field}" placeholder="${esc(ph)}"></div>`;
            const swotBody = `
    ${aiLinkCtaHtml_(sw.prompt, 'Temukan SWOT Analysis Kamu Disini')}
    <div class="swot-grid4" style="margin-top:16px;">
      <div><div class="swot-col-head s">Strength</div>${[0, 1, 2].map(i => swField_('sw_strength' + (i + 1), sw.strength[i], '#' + (i + 1))).join('')}</div>
      <div><div class="swot-col-head w">Weakness</div>${[0, 1, 2].map(i => swField_('sw_weakness' + (i + 1), sw.weakness[i], '#' + (i + 1))).join('')}</div>
      <div><div class="swot-col-head o">Opportunity</div>${[0, 1, 2].map(i => swField_('sw_opportunity' + (i + 1), sw.opportunity[i], '#' + (i + 1))).join('')}</div>
      <div><div class="swot-col-head t">Threat</div>${[0, 1, 2].map(i => swField_('sw_threat' + (i + 1), sw.threat[i], '#' + (i + 1))).join('')}</div>
    </div>`;

            return `
    ${mbtiDatalist}${viaDatalist}
    ${diriCard}
    <div class="sec-head" style="margin-top:0;"><h2>1️⃣ Ikigai Setup</h2></div>
    <div class="card pad" style="margin-bottom:22px;">
      ${setupBlockHtml_('1', 'Karakter dan Minat', step1Body)}
      ${setupBlockHtml_('2', 'Sweet Spot Ikigai dan Life Purpose', step2Body)}
      ${setupBlockHtml_('3', 'Sweetspot Career & Skill', step3Body)}
    </div>

    <div class="sec-head"><h2>2️⃣ Analisis SWOT</h2></div>
    <div class="card pad">${swotBody}</div>
  `;
        }
        function renderSetup() {
            ensureSetupLoaded_(() => {
                document.getElementById('view-setup').innerHTML = buildSetupHtml_();
                bindSetupEvents_();
            });
        }
        function bindSetupEvents_() {
            document.querySelectorAll('#view-setup .ai-open-btn').forEach(b => {
                b.addEventListener('click', () => {
                    const ai = S.setup.aiOptions.find(o => o.key === S.setup.aiChoice) || S.setup.aiOptions[0];
                    if (!ai) { toast('Pilih AI dulu di atas ya'); return; }
                    openExternal_(ai.base + encodeURIComponent(b.dataset.prompt));
                });
            });
            document.querySelectorAll('#view-setup [data-field]').forEach(el => {
                const evt = el.tagName === 'SELECT' ? 'change' : 'blur';
                el.addEventListener(evt, () => saveSetupField_(el.dataset.field, el.value, el));
            });
            document.getElementById('setup-ai-select').addEventListener('change', e => {
                saveSetupField_('ai_choice', e.target.value, e.target, '✅ AI andalan tersimpan');
            });
        }
        async function saveSetupField_(fieldKey, value, el, okMsg) {
            el.disabled = true;
            showLoad(true);
            try {
                const r = await callApi('saveSetupField', { fieldKey: fieldKey, value: value });
                showLoad(false); el.disabled = false;
                if (!r.success) { toast('Gagal simpan: ' + r.error); return; }
                S.setup = r.setup;
                toast(okMsg || '✅ Tersimpan ke sheet');
                renderSetup();
            } catch (e) {
                showLoad(false); el.disabled = false; onErr(e);
            }
        }

        const TITLES = { overview: ['Overview', 'Ringkasan profil & sweetspot karier kamu'], dream: ['Dream Plan', 'Goals per semester'], college: ['College Plan', 'Misi kuliah — semester saat ini'], action: ['Action Plan', 'Taktik eksekusi per quarter'], tracker: ['Tracker', 'Checklist mingguan dari Action Plan'], report: ['Report', 'Ringkasan perkembangan buat di-download'], identity: ['Personal Identity', 'Penjabaran karakter & arah karir kamu'], setup: ['Setup', 'Isi Ikigai & SWOT dari nol, nyambung langsung ke spreadsheet'] };
        const RENDERERS = { overview: renderOverview, dream: renderDream, college: renderCollege, action: renderAction, tracker: renderTracker, report: renderReport, identity: renderIdentity, setup: renderSetup };
        function go(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav').forEach(n => n.classList.toggle('active', n.dataset.view === view));
            document.getElementById('view-' + view).classList.add('active');
            document.getElementById('pg-title').textContent = TITLES[view][0];
            document.getElementById('pg-sub').textContent = TITLES[view][1];
            RENDERERS[view]();
            window.scrollTo(0, 0);
        }
        function checkAuthAndInit_() {
            const token = getToken();
            const actPage = document.querySelector('.activation-page');
            const sidebar = document.querySelector('.sidebar');
            const main = document.querySelector('.main');

            if (token) {
                if (actPage) actPage.style.display = 'none';
                if (sidebar) sidebar.style.display = '';
                if (main) main.style.display = '';
                startDashboard_();
            } else {
                if (actPage) actPage.style.display = 'flex';
                if (sidebar) sidebar.style.display = 'none';
                if (main) main.style.display = 'none';
                checkActivationStatus_();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAuthAndInit_, { once: true });
        } else {
            checkAuthAndInit_();
        }

        async function submitToken() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            const code = document.getElementById('tok').value.trim();
            if (!code) { msg.className = 'msg err'; msg.textContent = 'Token belum diisi.'; return; }
            btn.disabled = true;
            btn.textContent = 'Memeriksa...';
            msg.className = 'msg';
            msg.textContent = '';

            try {
                const r = await callApi('activateWithToken', { code: code });
                if (r && r.success) {
                    localStorage.setItem('user_token', code);
                    msg.className = 'msg ok';
                    msg.textContent = '✅ Aktivasi berhasil: ' + (r.produk || 'produk') + '.';
                    document.getElementById('tok').style.display = 'none';
                    btn.style.display = 'none';
                    const close = document.createElement('button');
                    close.className = 'closebtn';
                    close.textContent = 'Lanjut ke Dashboard';
                    close.onclick = function () {
                        checkAuthAndInit_();
                    };
                    document.body.querySelector('.activation-screen').appendChild(close);
                    const hint = document.createElement('div');
                    hint.className = 'sub';
                    hint.style.marginTop = '8px';
                    hint.textContent = 'Klik tombol di atas untuk masuk ke dashboard.';
                    document.body.querySelector('.activation-screen').appendChild(hint);
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Aktivasi Sekarang';
                    msg.className = 'msg err';
                    msg.textContent = '❌ ' + (r && (r.error || r.message) ? (r.error || r.message) : 'Token tidak valid.');
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Aktivasi Sekarang';
                msg.className = 'msg err';
                msg.textContent = '❌ Error: ' + (err.message || err);
            }
        }

        document.getElementById('tok').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submitToken();
        });

        async function checkActivationStatus_() {
            const tokInput = document.getElementById('tok');
            if (tokInput) {
                const savedToken = localStorage.getItem('user_token');
                if (savedToken) {
                    tokInput.value = savedToken;
                } else {
                    try {
                        const st = await callApi('getActivationStatus');
                        if (st && st.tokenInSheet) { tokInput.value = st.tokenInSheet; }
                    } catch (e) { }
                }
            }
        }
    </script>
</body>

</html>
